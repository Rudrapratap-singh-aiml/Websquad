<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StayServe</title><link rel="stylesheet" href="css/style.css"></head><body>
<section class="view on" id="v-landing"><div class="logo">🛎️</div><h1>StayServe</h1><p>Hotel Guest Service Request System</p><button class="btn big" onclick="show('v-login')">Open</button></section>
<section class="view" id="v-login"><h2>Welcome to StayServe</h2><div class="cards">
 <div class="card" onclick="guestLogin()"><h3>Login as Guest</h3><p>Request services for your room</p></div>
 <div class="card" onclick="staffLogin()"><h3>Login as Staff</h3><p>Handle your department's requests</p></div></div>
 <button class="link" onclick="show('v-landing')">&larr; Back</button></section>
<section class="view" id="v-gsign"><form id="gs" class="panel"><h2>New Guest Sign Up</h2>
 <input name="name" placeholder="Full name" required><input name="mobile" placeholder="Mobile number (10 digits)" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>
 <input name="email" type="email" placeholder="Email id" required><input name="room" placeholder="Room number (3-4 digits)" inputmode="numeric" pattern="[0-9]{3,4}" maxlength="4" required>
 <input name="password" type="password" placeholder="Password (8-16 characters)" minlength="8" maxlength="16" required>
 <div class="cap"></div><p class="err"></p><button class="btn">Register</button> <button type="button" class="link" onclick="show('v-login')">Cancel</button></form></section>
<section class="view" id="v-ssign"><form id="ss" class="panel"><h2>New Staff Sign Up</h2>
 <input name="name" placeholder="Full name" required><input name="empId" placeholder="Employee ID (6 digits)" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
 <input name="email" type="email" placeholder="Work email id" required><select name="dept" required><option value="">Department</option></select>
 <input name="password" type="password" placeholder="Password (8-16 characters)" minlength="8" maxlength="16" required>
 <div class="cap"></div><p class="err"></p><button class="btn">Register</button> <button type="button" class="link" onclick="show('v-login')">Cancel</button></form></section>
<section class="view dash" id="v-guest"><header><b>🛎️ StayServe</b><span id="gname"></span><button class="link" onclick="logout()">Logout</button></header><div class="cards">
 <div class="card" onclick="newM()"><h3>New Request</h3></div><div class="card" onclick="myM()"><h3>My Requests</h3></div><div class="card" onclick="svcM()"><h3>Hotel Services</h3></div></div></section>
<section class="view dash" id="v-staff"><header><b>🛎️ StayServe</b><span id="sname"></span><button class="link" onclick="logout()">Logout</button></header><div class="cards" id="scards"></div></section>
<div id="modal"><div class="panel"><button class="x" onclick="closeM()">&times;</button><h2 id="mt"></h2><div id="mb"></div></div></div><div id="toast"></div>
<script src="js/config.js"></script><script src="js/captcha.js"></script><script src="js/app.js"></script></body></html>
